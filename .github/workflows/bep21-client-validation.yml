name: WebTorrent client validation

on:
  push:
    branches: [feature/bep21-*]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-client-tests:
    name: Existing desktop and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WASM build workload
        run: dotnet workload install wasm-tools
      - name: Restore test harness
        run: dotnet restore PlaywrightMultiTest/PlaywrightMultiTest.csproj
      - name: Build test harness and demo projects
        run: dotnet build PlaywrightMultiTest/PlaywrightMultiTest.csproj --no-restore --configuration Release
      - name: Install Chrome for browser suite
        run: pwsh PlaywrightMultiTest/bin/Release/net10.0/playwright.ps1 install --with-deps chrome
      - name: Run all shared desktop and browser tests
        run: xvfb-run -a dotnet test PlaywrightMultiTest/PlaywrightMultiTest.csproj --no-build --configuration Release --logger "console;verbosity=normal"
